<!DOCTYPE html>
<html lang="es-CO">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Pedido de Uniforme Oficial | Academia Caucana de Taekwon-Do ITF</title>
    <meta
      name="description"
      content="Formulario oficial de pedido de uniforme (dobok) de la Academia Caucana de Taekwon-Do ITF en Popayán, Cauca."
    />
    <link rel="canonical" href="https://academiacaucana.com/uniforme-oficial/" />

    <!-- No indexar: el formulario real vive en el dominio de Google -->
    <meta name="robots" content="noindex, follow" />

    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />

    <link rel="icon" href="/favicon.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />

    <meta property="og:site_name" content="Academia Caucana de Taekwondo ITF" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://academiacaucana.com/uniforme-oficial/" />
    <meta property="og:locale" content="es_CO" />
    <meta property="og:title" content="Pedido de Uniforme Oficial | Academia Caucana de Taekwon-Do ITF" />
    <meta
      property="og:description"
      content="Diligencia el formulario oficial para pedir tu dobok de la Academia Caucana de Taekwon-Do ITF."
    />
    <meta property="og:image" content="https://academiacaucana.com/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://script.google.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --brand: #ff3b30;
        --brand-light: #ff6961;
        --surface: #000000;
        --surface-grouped: #1c1c1e;
        --ink: #f5f5f7;
        --ink-secondary: rgba(245, 245, 247, 0.78);
        --ink-tertiary: rgba(245, 245, 247, 0.58);
        --radius-control: 12px;
        --header-h: 60px;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        display: flex;
        flex-direction: column;
        min-height: 100svh;
        background: var(--surface);
        color: var(--ink);
        font-family: Inter, -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
        font-size: 1.0625rem;
        line-height: 1.47;
        letter-spacing: -0.022em;
      }

      /* --- Barra superior --- */
      .topbar {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        padding: 10px max(12px, env(safe-area-inset-left)) 10px max(12px, env(safe-area-inset-right));
        padding-top: calc(10px + env(safe-area-inset-top, 0px));
        border-bottom: 1px solid rgba(245, 245, 247, 0.1);
        background: rgba(28, 28, 30, 0.92);
        backdrop-filter: saturate(180%) blur(20px);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 44px;
        color: inherit;
        text-decoration: none;
      }

      .brand img {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        object-fit: cover;
      }

      .brand-text {
        font-family: 'Bebas Neue', 'Arial Narrow', sans-serif;
        font-size: 1.1rem;
        letter-spacing: 0.04em;
        line-height: 1.1;
      }

      .brand-sub {
        display: block;
        font-family: Inter, system-ui, sans-serif;
        font-size: 0.625rem;
        font-weight: 600;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--brand-light);
      }

      .topbar-actions {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .link-plain,
      .link-cta {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 8px 16px;
        border-radius: var(--radius-control);
        font-size: 0.9375rem;
        font-weight: 600;
        text-decoration: none;
        white-space: nowrap;
      }

      .link-plain {
        color: var(--ink-secondary);
      }

      .link-plain:hover {
        color: var(--ink);
      }

      .link-cta {
        background: var(--brand);
        color: #fff;
      }

      .link-cta:hover {
        background: var(--brand-light);
      }

      .link-plain:focus-visible,
      .link-cta:focus-visible,
      .brand:focus-visible {
        outline: 3px solid var(--brand-light);
        outline-offset: 2px;
      }

      /* --- Marco del formulario --- */
      .frame-wrap {
        position: relative;
        flex: 1 1 auto;
        min-height: 0;
        background: #fff;
      }

      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }

      /*
        Aviso de respaldo: se muestra SIEMPRE bajo el marco, porque desde el
        navegador no hay forma fiable de detectar cross-origin si el iframe
        se pintó o quedó bloqueado por X-Frame-Options.
      */
      .fallback {
        padding: 14px max(12px, env(safe-area-inset-left)) calc(14px + env(safe-area-inset-bottom, 0px));
        border-top: 1px solid rgba(245, 245, 247, 0.1);
        background: var(--surface-grouped);
        text-align: center;
        font-size: 0.875rem;
        color: var(--ink-tertiary);
      }

      .fallback a {
        color: var(--brand-light);
        font-weight: 600;
      }

      @media (max-width: 480px) {
        .brand-text {
          display: none;
        }
      }
    </style>
  </head>

  <body>
    <header class="topbar">
      <a class="brand" href="/">
        <img src="/logo.png" alt="" width="34" height="34" />
        <span class="brand-text">
          Pedido de Uniforme
          <span class="brand-sub">Academia Caucana ITF</span>
        </span>
      </a>

      <div class="topbar-actions">
        <a class="link-plain" href="/">← Volver al sitio</a>
        <a
          class="link-cta"
          href="https://script.google.com/macros/s/AKfycbyKVTPBO36vJl6f2q7wGM5aoRMYlX3pHFMcU4XqN6i4zdScFeFfmCpANP6Hileq3J2qdQ/exec"
          target="_blank"
          rel="noopener noreferrer"
          >Abrir aparte</a
        >
      </div>
    </header>

    <div class="frame-wrap">
      <iframe
        title="Formulario de pedido de uniforme oficial"
        src="https://script.google.com/macros/s/AKfycbyKVTPBO36vJl6f2q7wGM5aoRMYlX3pHFMcU4XqN6i4zdScFeFfmCpANP6Hileq3J2qdQ/exec"
        loading="eager"
        referrerpolicy="no-referrer-when-downgrade"
        allow="clipboard-write"
      ></iframe>
    </div>

    <p class="fallback">
      ¿El formulario no se ve?
      <a
        href="https://script.google.com/macros/s/AKfycbyKVTPBO36vJl6f2q7wGM5aoRMYlX3pHFMcU4XqN6i4zdScFeFfmCpANP6Hileq3J2qdQ/exec"
        target="_blank"
        rel="noopener noreferrer"
        >Ábrelo en una pestaña nueva</a
      >.
    </p>
  </body>
</html>
