                "@type": "Question",
                "name": "¿Cuánto cuesta el Taekwondo ITF en Academia Caucana?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "El plan mensual es $120.000 COP (3 clases por semana). El trimestral es $330.000 COP y el anual $1.200.000 COP. La primera clase de prueba es gratis, sin compromiso."
                }
              },
              {
                "@type": "Question",
                "name": "¿Desde qué edad pueden empezar los niños?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Aceptamos niños desde los 5 años. Tenemos grupos estructurados por edad: niños (5-9 años), prejuveniles (10-13 años), jóvenes (14-17 años) y adultos (18+)."
                }
              },
              {
                "@type": "Question",
                "name": "¿Los instructores están certificados?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Sí, todos nuestros instructores están certificados por la ITF (International Taekwon-Do Federation) y la ACTD (Asociación Colombiana de Taekwon-Do). Nuestro director, Jonathan López Cepeda, es cinturón negro certificado."
                }
              },
              {
                "@type": "Question",
                "name": "¿Qué logros ha obtenido la academia?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Somos Campeones Centroamericanos 2025 (República Dominicana), Academia Revelación ITF 2025, y obtuvimos el 3er lugar en Juegos Nacionales 2025. También campeones de Copa Súper Campeones 2024 y Copa Pelícano 2025."
                }
