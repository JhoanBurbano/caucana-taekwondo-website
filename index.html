              {
                "@type": "Question",
                "name": "¿Cuánto cuesta el Taekwondo ITF en Academia Caucana?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "El plan mensual es $150.000 COP (3 clases por semana). El trimestral es $405.000 COP y el anual $1.440.000 COP. La primera clase de prueba es gratis, sin compromiso."
                }
              },
              {
                "@type": "Question",
                "name": "¿Cuáles son los horarios de clase?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Entrenamos de lunes a sábado, mañana y tarde. Taekwon-Do tiene grupos de 4:00 p. m. a 8:00 p. m. entre semana y sábados a las 9:00 a. m.; Kickboxing y Boxeo van a las 9:00 a. m. y a las 7:00 p. m.; el acondicionamiento físico (entrenamiento funcional) es de 7:00 a 9:00 a. m. de martes a viernes, más el grupo de adultos los lunes a las 6:00 p. m."
                }
              },
              {
                "@type": "Question",
                "name": "¿Cuánto cuesta empezar, además de la mensualidad?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "La matrícula es $100.000 COP, pago único al inscribirse, y solo aplica a Taekwondo ITF. El uniforme oficial (dobok) cuesta $250.000 COP. Aparte y de forma opcional, el conjunto de sudadera y chaqueta rompevientos vale $230.000 COP, o $150.000 COP si prefieres solo la chaqueta."
                }
              },
              {
                "@type": "Question",
                "name": "¿Desde qué edad pueden empezar los niños?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Aceptamos niños desde los 6 años. Tenemos grupos estructurados por edad: niños (6-9 años), prejuveniles (10-13 años), jóvenes (14-17 años) y adultos (18+)."
                }
              },
              {
                "@type": "Question",
                "name": "¿Quién dicta las clases y con qué certificación?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Las dicta el director, Jonathan López Cepeda: cinturón negro II Dan, ex Selección Colombia de Taekwon-Do y subcampeón panamericano. El proceso está alineado con la ITF (International Taekwon-Do Federation) y la ACTD (Asociación Colombiana de Taekwon-Do)."
                }
              },
              {
                "@type": "Question",
                "name": "¿Dónde están ubicados en Popayán?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "En la Transversal 9A # 55N-30, zona norte de Popayán (Vía al Bosque, contiguo al sector Montelugano). Escríbenos por WhatsApp al +57 317 244 7000 o al correo info@www.caucanadetaekwondo.com para coordinar tu visita."
                }
              },
              {
                "@type": "Question",
                "name": "¿Qué logros ha obtenido la academia?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Lo más reciente: 3er puesto en la Copa Yom-Chi II 2026 (Bogotá), participación en el Suramericano 2026 en Perú (4o puesto) y 3er puesto en el Campeonato Nacional de Taekwon-Do 2025, disputado en Chía en noviembre. Antes: Campeones Centroamericanos 2025 (República Dominicana), Academia Revelación ITF 2025, más campeones de Copa Súper Campeones 2024 y Copa Pelícano 2025."
                }
